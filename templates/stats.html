{% extends 'base.html' %}
{% block content %}
<h4>Сводная статистика</h4>
{{ tables[0]|safe }}

<hr>
<h4>Графики</h4>
<div class="row">
    <div class="col-md-6">
        <img src="{{ url_for('static', filename='rating_dist.png') }}" class="img-fluid border">
    </div>
    <div class="col-md-6">
        <img src="{{ url_for('static', filename='time_dynamics.png') }}" class="img-fluid border">
    </div>
</div>
<div class="mt-4 row">
    <div class="col-md-8">
        <h4>Облако слов негативных отзывов</h4>
        <img src="{{ url_for('static', filename='wordcloud.png') }}" class="img-fluid border w-100">
    </div>
    <div class="col-md-4">
        <h4>Топ-5 слов в негативе</h4>
        <ul class="list-group">
            {% for word in top_5_neg_words %}
            <li class="list-group-item">{{ word }}</li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
